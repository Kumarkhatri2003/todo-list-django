<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 40px;
            background-color: #f8f9fa;
        }
        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="mb-4 text-center">📝 My To-Do List</h1>

    <form method="POST" class="mb-4">
        {% csrf_token %}
        <div class="input-group">
            {{ form.title }}
            <button class="btn btn-primary" type="submit">Add Task</button>
        </div>
    </form>

    <ul class="list-group">
        {% for task in tasks %}
            <li class="list-group-item d-flex justify-content-between align-items-center 
                {% if task.completed %}completed{% endif %}">
                {{ task.title }}
                <div>
                    {% if not task.completed %}
                        <a href="{% url 'complete_task' task.id %}" class="btn btn-sm btn-success">✔ Complete</a>
                    {% endif %}
                    <a href="{% url 'delete_task' task.id %}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Are you sure you want to delete this task?')">🗑 Delete</a>
                </div>
            </li>
        {% empty %}
            <li class="list-group-item text-muted">No tasks added yet.</li>
        {% endfor %}
    </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
